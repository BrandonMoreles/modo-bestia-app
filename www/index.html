<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Modo Bestia</title>
<style>
@font-face{font-family:"Barlow";font-weight:400;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface2:#f3f5f7; --ink:#1d2a33; --muted:#5d6b75;
  --line:#cfd7dc; --plate:#f2c230; --plate-ink:#1d2a33; --ok:#2f9e6e; --danger:#c8423b;
  --p:#d9534f; --c:#3a7bd5; --g:#e09b2d; --water:#2a9fd6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171c; --surface:#18222a; --surface2:#202c35; --ink:#e4eaee; --muted:#93a2ad;
    --line:#2d3b46; --ok:#45b884; --danger:#e0645d; --p:#ef7a76; --c:#6aa2ee; --g:#f0b452; --water:#4cb8eb;
  }
}
:root[data-theme="dark"]{
  --bg:#10171c; --surface:#18222a; --surface2:#202c35; --ink:#e4eaee; --muted:#93a2ad;
  --line:#2d3b46; --ok:#45b884; --danger:#e0645d; --p:#ef7a76; --c:#6aa2ee; --g:#f0b452; --water:#4cb8eb;
}
*,*::before,*::after{box-sizing:inherit}
details *,button,input,select,textarea{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 160px}

h1{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;margin:6px 2px 4px}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.1;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:0 2px 14px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.card{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.big{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1}
.big small{font-size:1rem;color:var(--muted);font-weight:600}

.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--plate);max-width:100%}
.macro{display:grid;grid-template-columns:76px 1fr 86px;align-items:center;gap:10px;margin:7px 0;font-size:.9rem}
.macro .v{text-align:right;color:var(--muted)}

.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px}
.seg::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.chip[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}

.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-family:var(--display);font-weight:700;font-size:1.1rem}
.btn.primary{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.btn.block{width:100%}
.btn.lg{font-size:1.3rem;padding:14px}
.btn.water{background:var(--water);border-color:var(--water);color:#fff}
.btn:disabled{opacity:.5}
.ghost{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:.9rem;color:var(--muted)}
.danger{color:var(--danger)!important;border-color:var(--danger)!important}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
.iconbtn{border:none;background:transparent;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:1.05rem;line-height:1}

input[type=text],input[type=number],input[type=search],input[type=time],input[type=date],input[type=password],input:not([type]),select,textarea{
  width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px}
label.f{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;flex:0 0 auto;border:none;padding:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:23px}

/* lista */
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .t{font-weight:500}
.li .d{font-size:.82rem;color:var(--muted)}

/* gym */
.ex{background:var(--surface);border-radius:14px;padding:14px 14px 10px;margin-bottom:12px;border-left:6px solid var(--line)}
.ex.done{border-left-color:var(--ok)}
.last{font-size:.85rem;margin:8px 0 6px;padding:6px 10px;background:var(--surface2);border-radius:8px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:6px 8px;align-items:center;margin-top:6px}
.sets .h{font-size:.72rem;color:var(--muted);text-align:center}
.sets .n{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;font-size:1.1rem}
.sets input{text-align:center;font-family:var(--display);font-weight:700;font-size:1.3rem;padding:10px 4px}
.chk{height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;font-size:1.2rem;font-weight:700}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
details.sess{background:var(--surface);border-radius:14px;margin-bottom:10px}
details.sess summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sess summary::-webkit-details-marker{display:none}
details.sess .body{padding:0 14px 12px;border-top:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:12px;padding:10px}
.stat .v{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.stat .l{font-size:.75rem;color:var(--muted);margin-top:4px}
svg{display:block;width:100%;height:auto}

/* comida */
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.mac{font-size:.8rem;color:var(--muted);white-space:nowrap}
.mac .P{color:var(--p)} .mac .C{color:var(--c)} .mac .G{color:var(--g)}
.recipe img{width:100%;border-radius:12px;margin:8px 0}
.recipe ol,.recipe ul{padding-left:20px;margin:6px 0}

/* enfoque */
.timer{font-family:var(--display);font-weight:800;font-size:4.4rem;text-align:center;line-height:1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.habit{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:none}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:0 0 auto;font-weight:700}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}

.empty{text-align:center;color:var(--muted);padding:26px 12px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.3rem;margin-bottom:4px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:none;background:transparent;padding:8px 2px 10px;color:var(--muted);border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:700;font-size:.95rem}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--plate)}

/* hoja modal */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:31;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));display:none;max-width:640px;margin:0 auto}
.sheet.on{display:block}

.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--plate);color:var(--plate-ink);border-radius:999px;padding:8px 8px 8px 18px;display:none;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:25}
.rest.on{display:flex}
.rest .time{font-family:var(--display);font-weight:800;font-size:1.6rem;min-width:62px}
.rest button{border:none;background:rgba(0,0,0,.12);border-radius:999px;padding:6px 12px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:40;max-width:90vw;text-align:center}
.toast.on{display:block}
/* mascota */
.petcard{display:flex;gap:12px;align-items:center;cursor:pointer}
.petmini{width:92px;flex:0 0 92px}
.petbig{width:200px;margin:0 auto}
.bubble{position:relative;background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:.92rem;margin-top:6px}
.petcard .bubble::before{content:"";position:absolute;left:-7px;top:14px;border:7px solid transparent;border-left:0;border-right-color:var(--surface2)}
.reto{border-left:6px solid var(--plate)}
.reto.listo{border-left-color:var(--ok)}
.sw{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:2px solid var(--line)}
.medallas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.medalla{background:var(--surface2);border-radius:12px;padding:10px;opacity:.55}
.medalla.on{opacity:1;outline:2px solid var(--plate)}
.medalla .ico{font-size:1.4rem}
.medalla .t{font-family:var(--display);font-weight:700;font-size:1.05rem}
.medalla .d{font-size:.78rem;color:var(--muted)}
.petbig{cursor:pointer;-webkit-user-select:none;user-select:none}
/* Animación de la mascota: cada parte se mueve y lo que trae puesto se mueve con ella */
.pet .p-fx{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .pet .p-cuerpo{transform-origin:100px 188px;animation:p-resp 3.4s ease-in-out infinite}
  .pet .p-cabeza{transform-origin:100px 132px;animation:p-cab 3.4s ease-in-out infinite}
  .pet .p-sombra{transform-origin:100px 192px;animation:p-sombra 3.4s ease-in-out infinite}
  .pet .p-parp{transform-origin:100px 85px;animation:p-parp 5s infinite}
  .pet .p-bizq{transform-origin:62px 132px;animation:p-bizq 3.4s ease-in-out infinite}
  .pet .p-bder{transform-origin:138px 132px;animation:p-bder 3.4s ease-in-out infinite}
  .pet.con-mancuerna .p-bder{animation:p-curl 4.2s ease-in-out infinite}
  .pet.con-shaker .p-bder{animation:p-shake 5s ease-in-out infinite}
  .pet .p-capa{transform-origin:100px 124px;animation:p-capa 2.8s ease-in-out infinite}
  .pet.animo-feliz .p-todo{transform-origin:100px 190px;animation:p-brinco 2.8s ease-in-out infinite}
  .pet.animo-triste .p-cabeza{animation:p-cab-triste 4s ease-in-out infinite}
  .pet.salta .p-todo{transform-origin:100px 190px;animation:p-salto .7s cubic-bezier(.3,.7,.4,1)}
  .pet.salta .p-sombra{animation:p-sombra-salto .7s ease-out}
  .pet.salta .p-fx{animation:p-fx .9s ease-out}
}
@keyframes p-resp{50%{transform:scale(1.02,.965)}}
@keyframes p-cab{50%{transform:translateY(2.6px) rotate(-1.5deg)}}
@keyframes p-cab-triste{0%,100%{transform:translateY(3px) rotate(4deg)}50%{transform:translateY(4.5px) rotate(5deg)}}
@keyframes p-sombra{50%{transform:scaleX(1.04)}}
@keyframes p-parp{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes p-bizq{50%{transform:rotate(6deg)}}
@keyframes p-bder{50%{transform:rotate(-6deg)}}
@keyframes p-curl{0%,35%,100%{transform:rotate(0)}55%,65%{transform:rotate(-58deg)}}
@keyframes p-shake{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(-28deg)}70%{transform:rotate(-14deg)}74%{transform:rotate(-30deg)}78%{transform:rotate(-12deg)}84%{transform:rotate(0)}}
@keyframes p-capa{50%{transform:skewX(-4deg) scaleX(1.03)}}
@keyframes p-brinco{0%,70%,100%{transform:translateY(0) scale(1,1)}76%{transform:translateY(0) scale(1.06,.92)}84%{transform:translateY(-12px) scale(.96,1.05)}92%{transform:translateY(0) scale(1.04,.95)}}
@keyframes p-salto{0%{transform:scale(1.08,.88)}35%{transform:translateY(-26px) scale(.94,1.08)}70%{transform:translateY(0) scale(1.06,.92)}100%{transform:none}}
@keyframes p-sombra-salto{35%{transform:scale(.7);opacity:.08}}
@keyframes p-fx{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
/* coach */
.msg{border-radius:14px;padding:10px 12px;margin:8px 0;max-width:88%;font-size:.95rem;border:1px solid transparent}
.msg.yo{background:var(--plate);color:var(--plate-ink);margin-left:auto;border-bottom-right-radius:4px}
.msg.ia{background:var(--surface);border-color:var(--line);border-bottom-left-radius:4px}
.cambios{margin-top:10px;padding:10px;border-radius:10px;background:var(--surface2)}
/* música */
.player{padding:10px 12px}
.pbtn{width:40px;height:40px;border-radius:50%;border:none;background:var(--surface2);font-size:1.05rem;line-height:1}
.pnota{width:46px;height:46px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:1.4rem;color:var(--muted);flex:0 0 auto}
.player a{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><main id="view"></main></div>

<div class="rest" id="rest" role="status" aria-live="polite">
  <span>Descanso</span><span class="time" id="restTime">0:00</span>
  <button id="restPlus">+30 s</button><button id="restStop">Listo</button>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="tabs" aria-label="Secciones"><div class="in" role="tablist">
  <button role="tab" data-tab="hoy" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Hoy</button>
  <button role="tab" data-tab="gym" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 10v4M22 10v4M5 7v10M19 7v10M8 9v6M16 9v6M8 12h8"/></svg>Gym</button>
  <button role="tab" data-tab="comida" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>Comida</button>
  <button role="tab" data-tab="enfoque" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Enfoque</button>
  <button role="tab" data-tab="bestia" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9L5 3l5 4M18 9l1-6-5 4"/><ellipse cx="12" cy="14" rx="8" ry="7"/><path d="M9.5 13h0M14.5 13h0"/><path d="M10 17q2 1.5 4 0"/></svg>Bestia</button>
</div></nav>

<script src="capacitor.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="bestia.js"></script>
<script src="extras.js"></script>
<script src="spotify.js"></script>
</body>
</html>
